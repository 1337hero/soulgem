<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lydia — Housecarl of Whiterun</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2b2e3a 0%, #16171d 70%);
    font-family: system-ui, sans-serif;
    color: #cfd2dc;
    display: grid;
    place-items: center;
  }
  #frame {
    width: 70vw;
    height: 92vh;
    border: 1px solid #3a3e4d;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.25));
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    position: relative;
    overflow: hidden;
  }
  #view { width: 100%; height: 100%; display: block; touch-action: none; }
  #title {
    position: absolute; top: 16px; left: 20px; pointer-events: none;
  }
  #title h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.04em; color: #e8e4d8; }
  #title p { font-size: 12px; color: #8b8fa0; margin-top: 2px; }
  #spin {
    position: absolute; bottom: 14px; right: 16px;
    background: rgba(255,255,255,0.07); color: #cfd2dc;
    border: 1px solid #3a3e4d; border-radius: 8px;
    padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  #spin:hover { background: rgba(255,255,255,0.14); }
  #talk {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(120,40,50,0.35); color: #e8e4d8;
    border: 1px solid #7a4a52; border-radius: 10px;
    padding: 10px 22px; font-size: 13px; cursor: pointer; user-select: none;
  }
  #talk.rec { background: rgba(200,60,70,0.65); border-color: #c85a62; }
  #talk.busy { opacity: 0.55; pointer-events: none; }
  #caption {
    position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
    max-width: 72%; text-align: center; font-size: 14px; line-height: 1.45;
    color: #e8e4d8; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #caption .you { color: #8b8fa0; font-size: 12px; display: block; margin-bottom: 3px; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 13px; color: #8b8fa0; pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 16px; left: 20px; font-size: 11px;
    color: #6b6f80; pointer-events: none;
  }
  #meter {
    position: absolute; bottom: 16px; right: 20px; font-size: 11px;
    color: #6b6f80; pointer-events: none; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="view"></canvas>
    <div id="title"><h1>Lydia</h1><p>Housecarl of Whiterun &middot; sworn to carry your burdens</p></div>
    <div id="loading">summoning housecarl&hellip;</div>
    <div id="hint">drag to orbit &middot; scroll to zoom &middot; hold <b>T</b> or the button to talk</div>
    <div id="caption"></div>
    <div id="meter"></div>
    <button id="spin">rotate</button>
    <button id="talk">&#127908; hold to talk</button>
  </div>
  <script type="module" src="bundle.js"></script>
</body>
</html>
