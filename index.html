<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soulgem</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2b2e3a 0%, #16171d 70%);
    font-family: system-ui, sans-serif;
    color: #cfd2dc;
    display: grid;
    place-items: center;
  }
  #frame {
    width: 70vw;
    height: 92vh;
    border: 1px solid #3a3e4d;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.25));
    box-shadow: 0 30px 80px rgba(0,0,0,0.55);
    position: relative;
    overflow: hidden;
  }
  #view { width: 100%; height: 100%; display: block; touch-action: none; }
  #spin {
    position: absolute; bottom: 14px; right: 16px;
    background: rgba(255,255,255,0.07); color: #cfd2dc;
    border: 1px solid #3a3e4d; border-radius: 8px;
    padding: 6px 14px; font-size: 12px; cursor: pointer;
  }
  #spin:hover { background: rgba(255,255,255,0.14); }
  /* talk button and text input share the same slot — they swap, so the bottom
     row never shifts. #modeBtn toggles between them. */
  #composer {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
  }
  #talk {
    background: rgba(120,40,50,0.35); color: #e8e4d8;
    border: 1px solid #7a4a52; border-radius: 10px;
    padding: 10px 22px; font-size: 13px; cursor: pointer; user-select: none;
  }
  #talk.rec { background: rgba(200,60,70,0.65); border-color: #c85a62; }
  #talk.busy { opacity: 0.55; pointer-events: none; }
  #textin {
    width: 380px; background: rgba(0,0,0,0.35); color: #e8e4d8;
    border: 1px solid #7a4a52; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none;
    line-height: 15px;   /* inputs size their own content box — pin it to #talk's */
  }
  #textin:focus { border-color: #c85a62; background: rgba(0,0,0,0.5); }
  #textin::placeholder { color: #6b6f80; }
  /* same padding/size/radius as #talk so the two line up; only the fill stays
     neutral to keep it secondary */
  #modeBtn {
    background: rgba(255,255,255,0.07); color: #cfd2dc;
    border: 1px solid #3a3e4d; border-radius: 10px;
    padding: 10px 22px; font-size: 13px; cursor: pointer;
    min-width: 65px;     /* keyboard and mic glyphs differ in width — no jitter on toggle */
  }
  #modeBtn:hover { background: rgba(255,255,255,0.14); }
  .hidden { display: none !important; }
  #caption {
    position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
    max-width: 72%; text-align: center; font-size: 14px; line-height: 1.45;
    color: #e8e4d8; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    pointer-events: none;
  }
  #caption .you { color: #8b8fa0; font-size: 12px; display: block; margin-bottom: 3px; }
  #loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 13px; color: #8b8fa0; pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 16px; left: 20px; font-size: 11px;
    color: #6b6f80; pointer-events: none;
  }
  #meter {
    position: absolute; top: 16px; right: 20px; font-size: 11px;
    color: #6b6f80; pointer-events: none; letter-spacing: 0.04em;
  }
  #souls {
    position: absolute; top: 12px; left: 16px;
    display: flex; gap: 6px;
  }
  #souls button {
    background: rgba(255,255,255,0.07); color: #8b8fa0;
    border: 1px solid #3a3e4d; border-radius: 8px;
    padding: 5px 12px; font-size: 11px; cursor: pointer;
    letter-spacing: 0.04em; text-transform: capitalize;
  }
  #souls button:hover { background: rgba(255,255,255,0.14); }
  #souls button.active {
    background: rgba(120,40,50,0.35); color: #e8e4d8; border-color: #7a4a52;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="view"></canvas>
    <div id="loading">summoning&hellip;</div>
    <div id="hint">drag to orbit &middot; scroll to zoom &middot; hold <b>T</b> to talk &middot; <b>I</b> to type</div>
    <div id="caption"></div>
    <div id="meter"></div>
    <div id="souls"></div>
    <button id="spin">rotate</button>
    <div id="composer">
      <button id="modeBtn" title="switch between voice and text (I / Esc)">&#9000;</button>
      <button id="talk">&#127908; hold to talk</button>
      <input id="textin" class="hidden" type="text" autocomplete="off"
             placeholder="say something&hellip;  (Enter to send, Esc for voice)">
    </div>
  </div>
  <script type="module" src="bundle.js"></script>
</body>
</html>
